<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#151419">
<style>
:root{--r:#E53945;--k:#151419;--k2:#222027;--w:#FFFDFB;--cr:#F6F0EA;--pk:#F1DCE3;--lv:#BDA6CC;--g:#9D96A3;--au:#E7C77A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(#ffffff14 1.2px,transparent 1.6px) 0 0/9px 9px,linear-gradient(115deg,var(--k) 0 62%,#E5394555 62% 64%,var(--k) 64% 100%) fixed;color:var(--w);font:700 16px/1.4 Nunito,system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.d{font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:400;letter-spacing:.02em;margin:0;text-transform:uppercase}
#app{max-width:760px;margin:0 auto;padding:12px 14px 96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;min-height:44px}
:focus-visible{outline:3px solid var(--au);outline-offset:2px}
.hero{background:radial-gradient(#15141944 2px,transparent 2.6px) 0 0/10px 10px,linear-gradient(160deg,var(--r) 0 68%,#151419 68% 72%,var(--r) 72%);clip-path:polygon(0 0,100% 0,100% 68%,92% 76%,96% 83%,70% 79%,73% 90%,42% 83%,31% 96%,13% 86%,0 100%);padding:18px 16px 64px;margin:0 -14px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(44px,14vw,84px);line-height:1.1;transform:rotate(-3deg);transform-origin:left}.hero h1 i{font-style:normal;display:inline-block;padding:0 .07em;margin:0 2px 4px 0;box-shadow:3px 3px 0 var(--k)}.r0{background:var(--w);color:var(--k);transform:rotate(-4deg)}.r1{background:var(--k);color:var(--w);transform:rotate(3deg) translateY(2px)}.r2{background:var(--w);color:var(--r);transform:rotate(2deg)}.r3{background:var(--k);color:var(--au);transform:rotate(-2deg) translateY(-3px)}.res div{text-shadow:3px 3px 0 var(--k)}
.hero small{display:block;font-size:13px;color:var(--k);background:var(--w);width:max-content;padding:2px 10px;transform:skew(-12deg);margin-bottom:8px}
.pt{position:absolute;right:-4px;top:4px;width:150px;filter:drop-shadow(5px 5px 0 #151419);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.pan{background:var(--w);color:var(--k);padding:12px 14px;margin:12px 0;box-shadow:6px 6px 0 var(--r);border-left:10px solid var(--k);animation:in .3s both}.pan:nth-of-type(odd){transform:rotate(-.5deg)}.pan:nth-of-type(even){transform:rotate(.4deg)}.pan.dk{border-left-color:var(--r);box-shadow:6px 6px 0 var(--w)}
.pan.dk{background:var(--k2);color:var(--w)}.pan.cm{background:var(--cr)}
@keyframes in{from{opacity:0;transform:translateX(-14px)}}
h2{font-size:28px;margin:14px 0 4px}h2 span{background:var(--w);color:var(--k);padding:0 10px;display:inline-block;transform:skew(-10deg) rotate(-1.5deg);box-shadow:5px 5px 0 var(--r)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap}
.btn{background:var(--r);color:var(--w);padding:8px 16px;transform:skew(-8deg);transition:transform .12s;font-weight:800}
.btn:hover{transform:skew(-8deg) translateX(3px)}.btn:active{transform:skew(-8deg) scale(.94)}
.btn.o{background:var(--k);color:var(--w)}.btn.s{min-height:44px;padding:6px 12px;font-size:14px}
.btn.l{background:var(--lv);color:var(--k)}
.bar{height:12px;background:#0003;transform:skew(-20deg);overflow:hidden}.bar i{display:block;height:100%;background:var(--r);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.num{font-family:Anton,Impact,sans-serif;font-size:44px;line-height:1}
.tag{font-size:12px;background:var(--k);color:var(--w);padding:1px 8px;margin-right:4px;display:inline-block}
.done{opacity:.6;text-decoration:line-through}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--k);border-top:4px solid var(--r);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{display:flex;width:100%;max-width:760px}
nav button{flex:1;background:none;font-family:Anton,Impact,sans-serif;font-size:14px;letter-spacing:.06em;color:var(--g);padding:12px 0;min-height:52px;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%)}
nav button[aria-current=page]{background:var(--w);color:var(--r);transform:translateY(-10px) scale(1.12) rotate(-3deg);clip-path:none;box-shadow:5px 5px 0 var(--r)}
.ov{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cr);color:var(--k);width:100%;max-width:560px;padding:16px;max-height:90vh;overflow:auto;border-top:8px solid var(--r);animation:up .25s both}
@keyframes up{from{transform:translateY(40px);opacity:0}}
label{display:block;font-size:13px;margin-top:8px}
input,select,textarea{width:100%;min-height:44px;padding:8px;border:2px solid var(--k);background:var(--w);color:var(--k)}
.err{color:var(--r);font-size:13px}
.res{position:fixed;inset:0;z-index:30;background:repeating-conic-gradient(var(--r) 0 8deg,#151419 8deg 16deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:flash 1.6s both;pointer-events:none}
.res .num{font-size:96px;text-shadow:5px 5px 0 var(--k)}
@keyframes flash{0%{clip-path:polygon(0 50%,100% 40%,100% 60%,0 50%)}15%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}80%{opacity:1}100%{opacity:0}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal button{background:var(--k2);color:var(--w);padding:2px;min-height:44px;position:relative}
.cal button.t{outline:2px solid var(--au)}.cal button.sel{background:var(--r);transform:rotate(-3deg) scale(1.08)}
.cal b{position:absolute;right:4px;bottom:3px;width:6px;height:6px;background:var(--au);transform:rotate(45deg)}
.mut{color:var(--g);font-size:13px}
.pan .mut{color:#6b6470}
.pan.dk .mut{color:var(--g)}
.wipe{position:fixed;inset:0;z-index:50;background:linear-gradient(105deg,var(--r) 0 60%,var(--k) 60% 100%);pointer-events:none;animation:wp .5s both}@keyframes wp{0%{clip-path:polygon(0 0,0 0,-20% 100%,-20% 100%)}45%,55%{clip-path:polygon(0 0,130% 0,110% 100%,-20% 100%)}100%{clip-path:polygon(130% 0,130% 0,110% 100%,110% 100%)}}
.ptb{position:absolute;right:22px;top:12px;width:140px;height:140px;background:none;padding:0;animation:bob 4s ease-in-out infinite;filter:drop-shadow(5px 5px 0 #151419);z-index:2}.ptb svg,.ptb img{width:100%;height:100%;object-fit:cover;display:block}.ptb img{clip-path:polygon(12% 0,100% 6%,92% 100%,0 92%)}
.av{width:128px;height:160px;padding:0;background:var(--lv);color:var(--k);font:400 28px Anton,Impact;clip-path:polygon(12% 0,100% 6%,92% 100%,0 92%);flex:none}.av img{width:100%;height:100%;object-fit:cover;display:block}
.mi{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 18px;background:var(--k2);color:var(--w);font-family:Anton,Impact,sans-serif;font-size:24px;text-transform:uppercase;clip-path:polygon(0 8%,100% 0,97% 100%,3% 92%);transform:rotate(-1.5deg);animation:in .3s calc(var(--i,0)*70ms) both;transition:transform .12s}.mi small{display:block;font:700 12px Nunito,sans-serif;text-transform:none;color:var(--g)}.mi:hover,.mi:focus-visible{background:var(--w);color:var(--r);transform:rotate(-1.5deg) translateX(10px) scale(1.03)}.mi:hover small,.mi:focus-visible small{color:var(--k)}.mi.o{background:var(--r)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(115deg,transparent 0 55%,#E5394526 55% 59%,transparent 59%),conic-gradient(from 200deg at 100% 0,#E5394538,transparent 22%)}
.d,h3{display:inline-block;transform:skewX(-8deg)}

<script>
const K='daylight.v1',$=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

function seed(){const a=att0(),t=TODAY;const hb=hobs();return{name:'',onboarded:false,attrs:a,hobbies:hb,fav:hb.slice(0,3).map(h=>h.id),picked:{},me:'',mega:[],set:{vol:.5,music:false,big:false,calm:false,nomorn:false},

{id:uid(),t:'Sketch for 15 minutes',d:t,time:'19:30',dur:15,attr:'creativity',xp:10,st:'todo',aw:0,pr:'Normal'}],
log:[],refl:{},ach:[],dismissed:[],

{id:uid(),t:'Plan next week',type:'Weekly',attr:'discipline',dur:20,xp:14,diff:'Easy',st:'open'}],

const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let V='TODAY',selD=TODAY,calM=TODAY.slice(0,7),first=true;

const attXp=(id,from=MS+'-01')=>S.log.filter(l=>l.attr===id&&l.d>=from).reduce((a,l)=>a+l.xp,0);

// ---- progression engine (idempotent) ----
function complete(id){let ao=0;const a=S.acts.find(x=>x.id===id);if(!a||a.st==='done')return;
 a.st='done';a.aw=a.xp;S.log.push({id:uid(),act:id,attr:a.attr,xp:a.xp,d:TODAY,t:a.t});const td=S.acts.filter(x=>x.d===TODAY&&x.st!=='skip');if(td.length>=3&&td.every(x=>x.st==='done')&&!S.log.some(l=>l.act==='allout-'+TODAY)){S.log.push({id:uid(),act:'allout-'+TODAY,attr:'discipline',xp:15,d:TODAY,t:'All-Out Attack'});ao=1}
 if(a.qid){const q=S.quests.find(x=>x.id===a.qid);if(q)q.st='done'}if(a.tid){const t=allTasks().find(x=>x.id===a.tid);if(t)t.done=true}
 const before=lvlOf(total()-a.xp-(ao?15:0));save();checks();result(a,lvlOf(total())>before,ao)}
function undo(id){const a=S.acts.find(x=>x.id===id);if(!a||a.st!=='done')return;
 S.log=S.log.filter(l=>l.act!==id&&l.act!=='allout-'+a.d);a.st='todo';a.aw=0;
 if(a.qid){const q=S.quests.find(x=>x.id===a.qid);if(q)q.st='open'}if(a.tid){const t=allTasks().find(x=>x.id===a.tid);if(t)t.done=false}save();go()}
function checks(){const give=(k,t)=>{if(!S.ach.find(x=>x.k===k)){S.ach.push({k,t,d:TODAY});card(t)}};
 if(S.log.length)give('first','First quest completed');
 if(S.attrs.some(a=>attXp(a.id)>=a.goal))give('mile','Attribute milestone reached');

function recs(){const wk=addD(TODAY,-6),m=S.acts.filter(a=>a.d===TODAY&&a.st==='todo').reduce((x,a)=>x+a.dur,0);

 const live=S.attrs.filter(a=>a.on).map(a=>({a,x:attXp(a.id,wk)})).sort((p,q)=>p.x-q.x);
 return live.slice(0,2).filter(o=>!S.dismissed.includes(o.a.id+TODAY)).map(({a,x})=>({id:a.id+TODAY,attr:a.id,txt:a.n+' has earned '+x+' XP in the last 7 days, the least of your attributes. Want to add a 15-minute session?'}))}
// ---- UI helpers ----
function toast(t){const d=document.createElement('div');d.setAttribute('role','status');d.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%) rotate(-1deg);background:var(--au);color:var(--k);padding:8px 16px;z-index:40;font-weight:800;clip-path:polygon(0 0,100% 0,97% 100%,0 100%)';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)}

 d.innerHTML=`<div class="d" style="font-size:22px">${E(a.t)} cleared</div><div class="num" id="cnt">+0</div><div class="d" style="font-size:28px">${E(attr(a.attr).n)} XP</div>${ao?'<div class="d" style="font-size:40px;color:var(--au)">All-Out Attack! +15 XP</div>':''}<div class="d" style="font-size:${up?54:18}px">${up?'LEVEL UP! LV '+lvlOf(total()):'Level '+lvlOf(total())+' · '+total()+' XP'}</div>`;
 document.body.append(d);let n=0;const iv=setInterval(()=>{n=Math.min(a.xp,n+Math.ceil(a.xp/12));$('#cnt').textContent='+'+n;if(n>=a.xp)clearInterval(iv)},40);

function form(title,fields,cb,del){const o=document.createElement('div');o.className='ov';

function actForm(a){const n=!a;a=a||{t:'',d:selD,time:'09:00',dur:20,attr:'discipline',xp:12,pr:'Normal',note:''};

  if(!v.t)return'Give the activity a title.';if(!v.d||!v.time)return'Pick a date and time.';if(!(+v.dur>0))return'Minutes must be above 0.';if(!(+v.xp>=0&&+v.xp<=100))return'XP must be 0 to 100.';

function evForm(e){const n=!e;e=e||{t:'',d:selD,time:'12:00'};form(n?'New event':'Edit event',[{k:'t',l:'Title',v:e.t},{k:'d',l:'Date',t:'date',v:e.d},{k:'time',l:'Time',t:'time',v:e.time},{k:'rep',l:'Repeats',t:'select',o:[['','Never'],['7','Weekly (4 times)'],['1','Daily (7 times)']],v:''}],v=>{
  if(!v.t)return'Give the event a title.';if(!v.d)return'Pick a date.';if(n){const c=v.rep?(v.rep==='7'?4:7):1;for(let i=0;i<c;i++)S.events.push({id:uid(),t:v.t,d:addD(v.d,i*(+v.rep||0)),time:v.time})}else Object.assign(e,v)},n?null:()=>{S.events=S.events.filter(x=>x!==e)})}
